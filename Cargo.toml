[package]
name = "yami-greet"
version = "3.1.0"
edition = "2021"
description = "Login screen: a greetd greeter inside niri"
license = "MIT"
publish = false

[[bin]]
name = "yami-greet"
path = "src/main.rs"

[dependencies]
# the drawing library: Nemo's fork of yami (12-hour clock, the Nemo fish, shared night-light arguments)
yami-px = { git = "https://github.com/HamzaAkramv15/nemo", tag = "px-v3.1.0" }
smithay-client-toolkit = "0.20"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop-wayland-source = "0.4"
calloop = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = "1"
libc = "0.2"

[workspace]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
